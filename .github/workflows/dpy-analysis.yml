name: DPy Code Smell Analysis
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  dpy-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Run DPy (DesignitePy) analysis
        uses: DesigniteTools/DPyAction@v1.0.0
        with:
          PAT: ${{ secrets.PAT }}
          input-dir: ./tqdm
          output-dir: ./dpy-results
          exclude: "tests,benchmarks"
          output-format: csv,html

      - name: Upload DPy analysis report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: dpy-smell-report
          path: ./dpy-results
