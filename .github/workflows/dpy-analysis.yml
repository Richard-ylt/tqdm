name: DPy Code Smell Analysis
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  dpy-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install DPy (DesignitePy)
        run: pip install designite-py

      - name: Run DPy local analysis
        run: |
          mkdir -p ./dpy-results
          DPy analyze -i ./tqdm -o ./dpy-results --format csv

      - name: Upload DPy analysis report
        uses: actions/upload-artifact@v4
        with:
          name: dpy-smell-report
          path: ./dpy-results
